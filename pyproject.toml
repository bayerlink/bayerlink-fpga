[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bayerlink-fpga"
version = "0.3.0.dev0"
description = "The bayerlink receiver on FPGAs: the receiver and its front ends"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 WITH SHL-2.1"
license-files = ["LICENSE", "LICENSE-APACHE"]
authors = [{ name = "Serge Rabyking" }]
keywords = ["bayerlink", "fpga", "hdmi", "raw", "bayer", "verilog"]
dependencies = [
    # The receiver's output slice and its port declarations are np2hw's,
    # and the protocol tables it reads are bayerlink's; both are depended
    # on, never vendored.
    "np2hw>=0.6.1",
    "bayerlink>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/bayerlink/bayerlink-fpga"
Source = "https://github.com/bayerlink/bayerlink-fpga"

[tool.hatch.build.targets.wheel]
packages = ["bayerlink_fpga"]
